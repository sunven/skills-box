name: Release

on:
  push:
    tags:
      - 'v*' # 触发条件：推送 v* tag (例如 v0.2.0)

permissions:
  contents: write

jobs:
  build-tauri:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri-aarch64-apple-darwin
          cache-on-failure: true

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'skills-box v__VERSION__'
          releaseBody: |
            ## skills-box v__VERSION__

            本次更新说明见 [CHANGELOG](https://github.com/sunven/skills-box/blob/main/CHANGELOG.md)。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          retryAttempts: 2
          args: '--target aarch64-apple-darwin --bundles dmg,app'

      - name: Verify updater metadata
        run: |
          gh release download "$GITHUB_REF_NAME" -p latest.json -O /tmp/latest.json --clobber
          jq -e '.version != null
            and .platforms["darwin-aarch64"].url != null
            and .platforms["darwin-aarch64"].signature != null' /tmp/latest.json > /dev/null
          echo "✓ latest.json contains darwin-aarch64 entry"
